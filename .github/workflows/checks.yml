name: Checks
on:
  pull_request:
  push:
    branches: [main]
    paths: ['data/**', 'scripts/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Agent Horizon checks
        run: python3 scripts/check.py
